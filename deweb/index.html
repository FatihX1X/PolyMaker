<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TapeOut DeWEB Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #05070c; --fg: #f4f3ef; --muted: #8a8f99; --accent: #19b394; --line: rgba(244,243,239,.12); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font-family: Inter, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 16px; }
  .stage { width: min(100%, calc((100vh - 120px) * 16 / 9)); aspect-ratio: 16 / 9; position: relative; }
  canvas { width: 100%; height: 100%; display: block; border-radius: 10px; box-shadow: 0 30px 80px rgba(0,0,0,.6); background: #000; }
  .bar { width: min(100%, calc((100vh - 120px) * 16 / 9)); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  button { font: 600 13px "JetBrains Mono", monospace; letter-spacing: .08em; color: var(--fg); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
  .time { font: 500 13px "JetBrains Mono", monospace; color: var(--muted); min-width: 110px; text-align: right; }
  body.render { padding: 0; display: block; background: #000; }
  body.render .bar { display: none; }
  body.render .stage { width: 1920px; height: 1080px; }
  body.render canvas { width: 1920px; height: 1080px; border-radius: 0; box-shadow: none; }
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div class="bar">
  <button id="play">▶ PLAY</button>
  <button data-lang="tr">TÜRKÇE</button>
  <button data-lang="en">ENGLISH</button>
  <button id="subs" aria-pressed="true">SUBS</button>
  <input id="seek" type="range" min="0" max="93" step="0.01" value="0">
  <span class="time" id="time">0.00 / 93.00</span>
</div>
<script src="i18n.js"></script>
<script src="../shared/motion.js"></script>
<script src="film.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const film = window.TapeOutFilm;
  const ctx = document.getElementById('c').getContext('2d');
  let lang = params.get('lang') === 'en' ? 'en' : 'tr';
  let subs = params.get('subs') !== '0';
  let t = parseFloat(params.get('t') || '0');
  let playing = false, last = 0;

  const fontsReady = Promise.all([
    '400 20px Inter', '500 20px Inter', '600 20px Inter', '700 20px Inter', '800 20px Inter',
    '700 20px "Inter Display"', '800 20px "Inter Display"', '500 20px "Inter Display"',
    '500 20px "JetBrains Mono"', '600 20px "JetBrains Mono"', '700 20px "JetBrains Mono"',
  ].map(f => document.fonts.load(f, 'AaİşĞüÇö01'))).catch(() => {});

  // Offline renderer hook: render(t) paints one frame.
  window.renderAt = (time, l, s = true) => film.drawFrame(ctx, time, l || lang, { subtitles: s });
  window.fontsReady = fontsReady;

  if (params.has('render')) {
    document.body.classList.add('render');
  } else {
    const seek = document.getElementById('seek'), timeEl = document.getElementById('time'), playBtn = document.getElementById('play');
    const sync = () => {
      document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
      document.getElementById('subs').setAttribute('aria-pressed', subs);
      document.documentElement.lang = lang;
    };
    const frame = (now) => {
      if (playing) {
        t += (now - last) / 1000;
        if (t >= film.DURATION) { t = film.DURATION; playing = false; playBtn.textContent = '▶ PLAY'; }
      }
      last = now;
      film.drawFrame(ctx, t, lang, { subtitles: subs });
      seek.value = t;
      timeEl.textContent = `${t.toFixed(2)} / ${film.DURATION.toFixed(2)}`;
      requestAnimationFrame(frame);
    };
    playBtn.onclick = () => {
      if (t >= film.DURATION) t = 0;
      playing = !playing;
      playBtn.textContent = playing ? '❚❚ PAUSE' : '▶ PLAY';
    };
    seek.oninput = () => { t = parseFloat(seek.value); };
    document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; sync(); });
    document.getElementById('subs').onclick = () => { subs = !subs; sync(); };
    document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playBtn.click(); } });
    sync();
    fontsReady.then(() => requestAnimationFrame(n => { last = n; frame(n); }));
  }
</script>
</body>
</html>
